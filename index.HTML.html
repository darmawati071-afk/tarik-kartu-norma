
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Norma dalam Kehidupanku - Game Menjodohkan</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#dff6ff,#fef9c3);}
header{background:#0f766e;color:#fff;padding:18px;text-align:center;}
#game{max-width:1200px;margin:auto;padding:20px;}
h2{color:#065f46}
.board{display:grid;grid-template-columns:1fr 1fr;gap:25px;}
@media(max-width:800px){.board{grid-template-columns:1fr;}}
.card,.drop{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.card{cursor:grab;border-left:8px solid #0ea5e9;font-weight:bold;}
.drop{min-height:55px;border:3px dashed #94a3b8;display:flex;align-items:center;justify-content:space-between;}
.drop.correct{border-color:#16a34a;background:#dcfce7;}
.drop.wrong{border-color:#dc2626;background:#fee2e2;}
.badge{background:#0ea5e9;color:#fff;padding:4px 8px;border-radius:999px;font-size:12px}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0;}
button{padding:10px 18px;border:none;border-radius:10px;background:#0f766e;color:white;font-size:16px;cursor:pointer}
button:hover{background:#115e59}
#message{font-size:22px;font-weight:bold;text-align:center;margin-top:20px;color:#065f46}
</style>
</head>
<body>
<header>
<h1>🎮 Norma dalam Kehidupanku</h1>
<p>Game Menjodohkan Interaktif • Kelas V SD • SD Negeri 8 Kodeoha</p>
</header>
<div id="game">
<div class="topbar">
<div><strong>Skor:</strong> <span id="score">0</span>/5</div>
<div><strong>Waktu:</strong> <span id="timer">00:00</span></div>
<button onclick="resetGame()">🔄 Ulangi</button>
</div>
<h2>Tarik kartu perilaku ke kotak jenis norma yang tepat.</h2>
<div class="board">
<div id="cards"></div>
<div id="targets"></div>
</div>
<div id="message"></div>
</div>

<script>
const data=[
 {text:"Beribadah sesuai agama",target:"Norma Agama"},
 {text:"Berkata jujur",target:"Norma Kesusilaan"},
 {text:"Mengucapkan salam ketika bertamu",target:"Norma Kesopanan"},
 {text:"Mematuhi rambu lalu lintas",target:"Norma Hukum"},
 {text:"Menghormati orang tua",target:"Norma Kesopanan"}
];
const targetNames=["Norma Agama","Norma Kesusilaan","Norma Kesopanan","Norma Hukum","Norma Kesopanan"];
let score=0,startTime=Date.now(),timerInt;

const cards=document.getElementById("cards");
const targets=document.getElementById("targets");

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

function beep(freq,dur){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(); const g=ctx.createGain();
 o.type='sine'; o.frequency.value=freq;
 o.connect(g); g.connect(ctx.destination);
 o.start();
 g.gain.setValueAtTime(.2,ctx.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur/1000);
 o.stop(ctx.currentTime+dur/1000);
}

function render(){
 cards.innerHTML=""; targets.innerHTML="";
 shuffle(data).forEach((item,i)=>{
   const c=document.createElement("div");
   c.className="card"; c.draggable=true;
   c.textContent=item.text;
   c.dataset.target=item.target;
   c.id="card"+i;
   c.addEventListener("dragstart",e=>e.dataTransfer.setData("text",c.id));
   cards.appendChild(c);
 });
 shuffle(targetNames).forEach((t,i)=>{
   const d=document.createElement("div");
   d.className="drop";
   d.dataset.name=t;
   d.innerHTML=`<span>${t}</span><span class="badge">Lepas di sini</span>`;
   d.addEventListener("dragover",e=>e.preventDefault());
   d.addEventListener("drop",dropCard);
   targets.appendChild(d);
 });
}

function dropCard(e){
 e.preventDefault();
 const id=e.dataTransfer.getData("text");
 const card=document.getElementById(id);
 if(!card) return;
 if(card.dataset.target===this.dataset.name){
   this.classList.add("correct");
   this.querySelector(".badge").textContent="Benar ✔";
   this.appendChild(card);
   card.draggable=false;
   score++;
   document.getElementById("score").textContent=score;
   beep(880,180);
 }else{
   this.classList.add("wrong");
   setTimeout(()=>this.classList.remove("wrong"),500);
   beep(220,250);
 }
 if(score===5){
   clearInterval(timerInt);
   document.getElementById("message").innerHTML="🏆 Hebat! Semua jawaban benar!";
   beep(1046,220); setTimeout(()=>beep(1318,220),180);
 }
}

function resetGame(){
 score=0;
 document.getElementById("score").textContent=0;
 document.getElementById("message").textContent="";
 startTime=Date.now();
 clearInterval(timerInt);
 timerInt=setInterval(updateTimer,1000);
 render();
}
function updateTimer(){
 let s=Math.floor((Date.now()-startTime)/1000);
 let m=String(Math.floor(s/60)).padStart(2,"0");
 s=String(s%60).padStart(2,"0");
 document.getElementById("timer").textContent=m+":"+s;
}
resetGame();
</script>
</body>
</html>
